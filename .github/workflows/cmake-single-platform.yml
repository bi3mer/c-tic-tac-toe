name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true

jobs:
  build:
    strategy:
      fail-fast: false  # Don't cancel other builds if one fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    - name: Install OpenGL (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxi-dev libxrandr-dev libxinerama-dev libxcursor-dev
    
    - name: Download Raylib (Linux)
      if: matrix.os == 'ubuntu-latest'
      env:
        PYTHONIOENCODING: utf-8
      run: python3 build_scripts/download_raylib.py --linux
    
    - name: Download Raylib (Mac)
      if: matrix.os == 'macos-latest'
      env:
        PYTHONIOENCODING: utf-8
      run: python3 build_scripts/download_raylib.py --mac
    
    - name: Download Raylib (Windows)
      if: matrix.os == 'windows-latest'
      env:
        PYTHONIOENCODING: utf-8
      run: python3 build_scripts/download_raylib.py --windows
    
    - name: Build
      run: |
        mkdir build
        cd build
        cmake ..
        cmake --build .
    
    - name: Package executable
      run: |
        cd build
        if [ "$RUNNER_OS" == "Windows" ]; then
          # Find and package .exe and .dll files
          7z a -tzip "../game-Windows.zip" *.exe ../lib/raylib/lib/*.dll 2>/dev/null || 7z a -tzip "../game-Windows.zip" *.exe
        elif [ "$RUNNER_OS" == "macOS" ]; then
          # Package the executable
          zip -r "../game-macOS.zip" project 2>/dev/null || zip -r "../game-macOS.zip" *
        else
          # Linux
          tar -czf "../game-Linux.tar.gz" project 2>/dev/null || tar -czf "../game-Linux.tar.gz" *
        fi
      shell: bash
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: game-${{ runner.os }}
        path: game-*.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Display structure of downloaded files
      run: ls -R artifacts
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: Release ${{ github.event.inputs.version }}
        draft: false
        prerelease: false
        files: |
          artifacts/game-Linux/game-Linux.tar.gz
          artifacts/game-macOS/game-macOS.zip
          artifacts/game-Windows/game-Windows.zip
